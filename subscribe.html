<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/styles.css">
    <title>Destiny para nuevos Guardianes | Suscripción</title>
</head>

<body>

    <header>
        <nav class="navbar">
            <a href="index.html">
                <img class="logo" src="./img/destiny-svgrepo-com.svg" alt="Logo de Destiny 2">
            </a>

            <ul class="nav">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="index.html#moments">Momentos</a></li>
                <li><a href="subscribe.html" class="active">Suscripción</a></li>
            </ul>
        </nav>
    </header>

    <main class="page">
        <h1 class="page-title">Únete a la Vanguardia</h1>
        <p class="page-intro">Suscríbete y recibe noticias de Destiny en tu correo.</p>

        <form class="form" action="#" method="post">
            <label for="name">Nombre</label>
            <input type="text" id="name" name="name" placeholder="Tu nombre de Guardián" required>

            <label for="email">Correo electrónico</label>
            <input type="email" id="email" name="email" placeholder="guardian@ejemplo.com" required>

            <label for="guardian-class">Tu clase favorita</label>
            <select id="guardian-class" name="guardian-class">
                <option value="titan">Titán</option>
                <option value="hunter">Cazador</option>
                <option value="warlock">Hechicero</option>
            </select>

            <button type="submit" class="btn">Suscribirme</button>
        </form>
    </main>

    <footer class="footer">
        <p>Proyecto realizado en el curso Desarrollador Web Front-End de Kodigo. Sin fines de lucro. Destiny es una marca de Bungie.</p>
    </footer>

</body>

</html>
